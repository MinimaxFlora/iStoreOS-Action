# Feed definition used by scripts/build_istoreos.py.
# Baseline is the upstream feeds.conf.default shipped by istoreos-25.12
# (jjm2473 mirrors for packages/luci, upstream OpenWrt feeds for
# routing/telephony/video, the iStore feed and the jjm2473 third-party feed).
# The plugin feeds below are appended on top of that baseline. Tracked
# branches are intentionally left unpinned so the build always follows the
# latest sources, as requested.

# --- upstream istoreos-25.12 baseline ---
src-git packages https://github.com/jjm2473/packages.git;istoreos-25.12
src-git luci https://github.com/jjm2473/luci.git;istoreos-25.12
src-git routing https://github.com/openwrt/routing.git;openwrt-25.12
src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12
src-git video https://github.com/openwrt/video.git;openwrt-25.12
src-git store https://github.com/linkease/istore.git;main
src-git third https://github.com/jjm2473/openwrt-third.git;main

# --- request-based plugin feeds ---
# helloworld provides luci-app-homeproxy plus the shared proxy engines
# (sing-box/xray-core/v2ray-core/v2ray-geodata) that passwall and homeproxy
# both reuse, so the engines are taken from a single feed.
src-git helloworld https://github.com/sbwml/openwrt_helloworld.git;v5
# openwrt_pkgs provides sbwml's luci-app-ota + otahelper used to replace the
# in-tree iStoreOS OTA so upgrades can be pointed at our own gh-pages manifest.
src-git openwrt_pkgs https://github.com/sbwml/openwrt_pkgs.git;main
# Nikki (mihomo based) proxy.
src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main
# PassWall LuCI application only; its engine dependencies resolve from the
# helloworld feed above.
src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
